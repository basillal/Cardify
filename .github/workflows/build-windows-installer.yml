name: Build Windows installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Inno Setup (required for jpackage --type exe)
        run: choco install innosetup -y

      - name: Build project and copy runtime deps
        run: mvn -B clean package dependency:copy-dependencies -DincludeScope=runtime

      - name: Run Windows installer script
        shell: cmd
        run: .\build-installer.bat

      - name: List dist folder
        shell: cmd
        run: dir dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardify-windows-installer
          path: dist/**
